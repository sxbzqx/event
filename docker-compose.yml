name: eventflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-event_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend/api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-event_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:3000}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5280}:8080"

  client:
    build:
      context: ./client
      args:
        # Адрес API для БРАУЗЕРА (вшивается в бандл при сборке)
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5280}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${CLIENT_PORT:-3000}:3000"

volumes:
  pgdata:
